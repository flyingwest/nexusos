name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coordination
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: coordination/go.sum
      - name: go test
        run: go test ./...
      - name: go build
        run: |
          go build -o ../bin/coordinator ./cmd/coordinator
          go build -o ../bin/nexusctl ./cmd/nexusctl

  provision-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: nexusos-provision tests
        run: ./scripts/test-nexusos-provision.sh

# Node disk image builds (mmdebstrap + loop mounts) stay manual on a privileged
# Linux builder — see docs/node-image.md.
